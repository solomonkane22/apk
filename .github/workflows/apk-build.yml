name: Decompile, Patch & Rebuild APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'İşlenecek APK dosyasının doğrudan indirme linki'
        required: true
        default: 'https://files.catbox.moe/mdmsyp.apk'
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Apktool & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool default-jdk
        echo "Apktool ve Java başarıyla kuruldu."

    - name: Download APK from Catbox
      run: |
        echo "Catbox üzerinden APK dosyası indiriliyor..."
        # URL'yi temiz bir şekilde tırnak içinde çağırıyoruz
        URL="${{ inputs.apk_url }}"
        echo "İndirilen adres: $URL"
        wget --no-check-certificate -O input.apk "$URL"
        
        # Dosya boyutu ve türü kontrolü
        ls -lh input.apk
        file input.apk

    - name: Decompile APK with Apktool
      run: |
        # APK'yı söküyoruz (decode)
        apktool d input.apk -o decompiled_source -f
        echo "APK kaynak kodlarına ve smali dosyalarına ayrıştırıldı."

    - name: Apply Custom Patches / Modifications
      run: |
        echo "Özel yama adımları için bu alan kullanılabilir."

    - name: Rebuild APK with Apktool
      run: |
        # Sökülen klasörü tekrar APK formatında paketliyoruz (rebuild)
        apktool b decompiled_source -o unsigned.apk
        echo "APK başarıyla yeniden derlendi/paketlendi."

    - name: Sign APK (Align and Sign)
      run: |
        # Test imzası oluşturuluyor
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US"
        
        # zipalign işlemi
        zipalign -p -f 4 unsigned.apk aligned.apk
        
        # apksigner ile imzalama
        apksigner sign --ks debug.keystore --ks-pass pass:android --in aligned.apk final-rebuilt.apk
        echo "APK başarıyla imzalandı!"

    - name: Upload Rebuilt APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rebuilt-Modded-APK
        path: final-rebuilt.apk
